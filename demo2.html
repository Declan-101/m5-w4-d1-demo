<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Tests</title>
  <script>
    function setBodyAttr(attr, value) {
      if (document.body) {
        document.body[attr] = value;
        // Keep the link demo working in browsers that ignore the legacy body.link property.
        if (attr === 'link') document.getElementById('sample').style.color = value;
      }
      else throw new Error("no support");
    }
  </script>
</head>
<body>
  <div style="margin: .5in; height: 400px;">
    <p><b><code>text</code></b></p>
    <form>
      <select aria-label="Text color" onChange="setBodyAttr('text', this.options[this.selectedIndex].value);">
        <option value="black">black</option>
        <option value="red">red</option>
      </select>
      <p><b><code>bgColor</code></b></p>
      <select aria-label="Background color" onChange="setBodyAttr('bgColor', this.options[this.selectedIndex].value);">
        <option value="white">white</option>
        <option value="lightgrey">gray</option>
      </select>
      <p><b><code>link</code></b></p>
      <select aria-label="Link color" onChange="setBodyAttr('link', this.options[this.selectedIndex].value);">
        <option value="blue">blue</option>
        <option value="green">green</option>
      </select>
      <small>
        <a href="#sample" id="sample">
          (sample link)
        </a>
      </small><br />
      <input type="button" value="version" />
    </form>
  </div>
</body>
</html>
